name: Pruebas SupplyHub
on: [push, pull_request]
permissions:
  contents: read
jobs:
  django:
    runs-on: ubuntu-latest
    env:
      DATAANALYTICS_ENABLED: 'False'
      GOOGLE_OAUTH_ENABLED: 'False'
      GMAIL_ENABLED: 'False'
      AD_LDAP_ENABLED: 'False'
      PAYROLL_AUTH_ENABLED: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python Otros/manage.py check
      - run: python Otros/manage.py makemigrations --check --dry-run
      - run: python Otros/manage.py test tests --noinput
