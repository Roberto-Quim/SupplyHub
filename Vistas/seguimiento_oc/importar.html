{% extends "base.html" %}

{% block content %}
<section class="q-card">
    <div>
        <h2>{{ page_title }}</h2>
        <p class="muted">Sube el reporte de Oracle Open Purchase Orders (.xlsx) para actualizar el seguimiento.</p>
    </div>
    
    <!-- Alertas de errores críticos -->
    {% if messages %}
        <div class="q-messages" style="margin-top: 1rem;">
            {% for message in messages %}
                <div style="padding: 1rem; margin-bottom: 0.5rem; border-radius: 4px; background-color: #fef2f2; border: 1px solid #fecaca; color: #991b1b;">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="post" enctype="multipart/form-data" style="margin-top: 2rem;">
        {% csrf_token %}
        
        <div style="margin-bottom: 2rem; padding: 1.5rem; border: 1px dashed #ccc; border-radius: 8px; background: #fafafa;">
            {{ form.as_p }}
        </div>

        <div style="display: flex; gap: 1rem; align-items: center; margin-top: 1.5rem;">
            <button type="submit" style="padding: 0.5rem 1.25rem; background-color: #e6007e; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">
                Importar Archivo
            </button>
            <a href="{% url 'supplyhub:seguimiento_oc' %}" style="padding: 0.5rem 1.25rem; background-color: #e5e7eb; color: #374151; text-decoration: none; border-radius: 4px; display: inline-block; font-weight: 500;">
                Cancelar
            </a>
        </div>
    </form>
</section>
{% endblock %}
