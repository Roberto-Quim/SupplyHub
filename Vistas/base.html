<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SupplyHub{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f5; color: #1f1f1f; }
        header { background: #8b0000; color: white; padding: 1rem 1.5rem; }
        main { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; border-radius: 12px; padding: 1.25rem; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
        .muted { color: #666; }
    </style>
</head>
<body>
<header><strong>{{ supplyhub_name|default:"SupplyHub" }}</strong></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
