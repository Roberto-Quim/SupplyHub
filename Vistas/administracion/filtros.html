<form method="get" class="filter-bar"><div><label for="q">Buscar</label><input id="q" name="q" value="{{ q }}" placeholder="Nombre, nómina, correo o sitio"></div><div><label for="estado">Estado</label><select id="estado" name="estado"><option value="">Todos</option><option value="1" {% if estado == '1' %}selected{% endif %}>Activos</option><option value="0" {% if estado == '0' %}selected{% endif %}>Inactivos</option></select></div><button class="btn btn-primary">Filtrar</button><a href="{{ request.path }}">Limpiar</a></form>
